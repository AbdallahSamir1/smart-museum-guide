<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gesture guide · Smart Museum Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- not render-blocking: without internet the guide still opens at once, with the system fonts -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Playfair+Display:wght@700&family=Cairo:wght@400;700&display=swap">
<style>
  :root { --bg:#0f1726; --card:#1b2a41; --border:#2c3d5a; --text:#fff; --muted:#8ea0b8;
          --accent:#1f8f86; --accent-text:#6fe0c0; --warn:#e3b55a; }
  * { box-sizing: border-box; }
  html { background: var(--bg); color: var(--text); scroll-behavior: smooth; }
  body { margin: 0; font: 17px/1.55 'DM Sans', 'Cairo', sans-serif; }
  [dir=rtl] body { font-family: 'Cairo', 'DM Sans', sans-serif; }
  .h { font-family: 'Playfair Display', 'Cairo', serif; font-weight: 700; }
  [dir=rtl] .h { font-family: 'Cairo', serif; }
  a { color: var(--accent-text); }
  :focus-visible { outline: 3px solid var(--accent-text); outline-offset: 2px; }

  .top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
         backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
  .top .in { max-width: 1180px; margin: 0 auto; padding: 10px 24px; display: flex; gap: 12px;
             align-items: center; flex-wrap: wrap; }
  .back { font-weight: 700; text-decoration: none; }
  .langs { margin-inline-start: auto; display: flex; gap: 8px; }
  .langs button { font: inherit; font-size: 15px; font-weight: 700; padding: 7px 16px; border-radius: 999px;
                  background: var(--card); color: var(--muted); border: 1.5px solid var(--border); cursor: pointer; }
  .langs button[aria-pressed=true] { background: var(--accent); color: #fff; border-color: var(--accent-text); }

  main { max-width: 1180px; margin: 0 auto; padding: 0 24px 64px; }
  .hero { padding: 34px 0 4px; }
  .hero h1 { font-size: clamp(34px, 5vw, 52px); margin: 0 0 6px; line-height: 1.1; }
  .hero p { color: var(--muted); font-size: 20px; margin: 0; }
  section { margin-top: 46px; scroll-margin-top: 72px; }
  h2 { font-size: 30px; margin: 0 0 14px; }

  .tips { counter-reset: tip; list-style: none; padding: 0; margin: 0; display: grid; gap: 12px;
          grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
  .tips li { counter-increment: tip; position: relative; background: var(--card); border: 1.5px solid var(--border);
             border-radius: 14px; padding: 14px 16px; padding-inline-start: 58px; }
  .tips li::before { content: counter(tip); position: absolute; inset-inline-start: 14px; top: 13px; width: 30px;
                     height: 30px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700;
                     display: grid; place-items: center; }

  .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
  .card { background: var(--card); border: 1.5px solid var(--border); border-radius: 18px; padding: 18px 20px 20px; }
  .card .pic { font-size: 64px; line-height: 1.1; }
  .card h3 { font-size: 26px; margin: 4px 0 0; line-height: 1.2; }
  .meaning { color: var(--accent-text); font-weight: 700; font-size: 19px; margin: 2px 0 10px; }
  .card ol { margin: 0 0 12px; padding-inline-start: 22px; }
  .card ol li { margin-bottom: 4px; }
  .meta { display: flex; gap: 6px 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; font-size: 15px; }
  .meta b { color: var(--muted); margin-inline-end: 2px; }
  .chip { display: inline-block; padding: 3px 11px; border-radius: 999px; background: var(--bg);
          border: 1px solid var(--border); }

  .table-wrap { overflow-x: auto; border: 1.5px solid var(--border); border-radius: 16px; }
  table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 16px; }
  th, td { padding: 12px 14px; text-align: start; vertical-align: top; border-bottom: 1px solid var(--border); }
  thead th { background: var(--card); color: var(--muted); font-size: 15px; }
  tbody th { white-space: nowrap; }
  tbody tr:last-child > * { border-bottom: none; }

  .help { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
  .help div { background: var(--card); border: 1.5px solid var(--border); border-radius: 14px; padding: 14px 18px; }
  .help h3 { font-size: 18px; margin: 0 0 4px; }
  .help p { margin: 0; color: #d6deea; }
  footer { margin-top: 56px; color: var(--muted); font-size: 14px; text-align: center; }
</style>
</head>
<body>
<div class="top"><div class="in">
  <a class="back" id="back" href="index.html"></a>
  <div class="langs" id="langs" role="group"></div>

const h = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

function render(t) {
  const cards = KEYS.map(k => {
    const g = t.g[k];
    return `<article class="card" id="${k}">
      <div class="pic" aria-hidden="true">${PICS[k]}</div>
      <h3 class="h">${h(g.name)}</h3>
      <div class="meaning">${h(g.meaning)}</div>
      <ol>${g.steps.map(s => `<li>${h(s)}</li>`).join("")}</ol>
      <div class="meta"><b>${h(t.where)}</b>${g.where.map(w => `<span class="chip">${h(w)}</span>`).join("")}</div>
      <div class="meta"><b>${h(t.time)}</b><span>${h(g.time)}</span></div>
    </article>`;
  }).join("");
  const table = `<div class="table-wrap"><table>
    <thead><tr>${t.cols.map(c => `<th>${h(c)}</th>`).join("")}</tr></thead>
    <tbody>${t.rows.map(r => `<tr><th scope="row">${h(r[0])}</th>${r.slice(1).map(c => `<td>${h(c)}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div>`;
  $app.innerHTML = `
    <div class="hero"><h1 class="h">${h(t.title)}</h1><p>${h(t.sub)}</p></div>
    <section><h2 class="h">${h(t.s_before)}</h2><ol class="tips">${t.tips.map(x => `<li>${h(x)}</li>`).join("")}</ol></section>
    <section><h2 class="h">${h(t.s_gestures)}</h2><div class="grid">${cards}</div></section>
    <section><h2 class="h">${h(t.s_table)}</h2>${table}</section>
    <section><h2 class="h">${h(t.s_help)}</h2><div class="help">${t.help.map(([a, b]) => `<div><h3>${h(a)}</h3><p>${h(b)}</p></div>`).join("")}</div></section>
    <footer>${h(t.foot)}</footer>`;
}

const $app = document.getElementById("app");
function setLang(code, keepUrl) {
  const t = T[code] || T.en;
  code = T[code] ? code : "en";
  document.documentElement.lang = code;
  document.documentElement.dir = t.dir;
  document.title = t.title + " · Smart Museum Guide";
  const back = document.getElementById("back");
  back.textContent = t.back;
  back.href = "index.html";
  const langs = document.getElementById("langs");
  langs.setAttribute("aria-label", t.langGroup);
  langs.innerHTML = LANGS.map(([c, n]) => `<button type="button" data-l="${c}" aria-pressed="${c === code}">${n}</button>`).join("");
  for (const b of langs.querySelectorAll("button")) b.onclick = () => setLang(b.dataset.l);
  render(t);
  if (!keepUrl) history.replaceState(null, "", "?lang=" + code);
}
function firstLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (T[q]) return q;
  const n = (navigator.language || "en").slice(0, 2);
  return T[n] ? n : "en";
}
setLang(firstLang(), true);
</script>
